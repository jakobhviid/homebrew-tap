name: Test navibeat-linux on Linux

# Why a workflow of its own rather than more steps in test-cask.yml: that one is
# orca's suite, and nothing it asserts carries over. NaviBeat is a jpackage'd
# Kotlin app with its own Java runtime and libVLC, not Electron — no sandbox, no
# updater manifest, no Node-mode CLI — so what is here is the install and the
# integration this cask claims, on both architectures upstream publishes.
on:
  push:
    branches: [main]
    paths:
      - "Casks/navibeat-linux.rb"
      - ".github/workflows/test-navibeat-cask.yml"
      - ".github/actions/mount-tap/**"
      - ".github/actions/fetch/**"
  pull_request:
    paths:
      - "Casks/navibeat-linux.rb"
      - ".github/workflows/test-navibeat-cask.yml"
      - ".github/actions/mount-tap/**"
      - ".github/actions/fetch/**"
  workflow_dispatch:
  # Why: the scheduled version bump calls this to validate a candidate commit on
  # both architectures before it is allowed anywhere near main.
  workflow_call:
    inputs:
      ref:
        description: "Commit or branch to test. Defaults to the triggering ref."
        type: string
        required: false

permissions:
  contents: read

concurrency:
  # Why github.workflow: when the bump pipeline calls this reusably, this
  # resolves to the caller's name, so a validation run cannot be cancelled by an
  # unrelated push to the same ref.
  group: test-navibeat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cask:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      # Why: an auto-update fetches and hard-resets the tap from GitHub, which
      # would silently replace the commit under test with whatever is on main.
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v5
        with:
          # An empty value keeps actions/checkout's default behaviour, so the
          # push and workflow_dispatch triggers are unaffected.
          ref: ${{ inputs.ref }}

      - name: Install desktop and Java GUI runtime dependencies
        run: |
          sudo apt-get update
          # dbus supplies dbus-run-session, so the smoke test has the session bus
          # every desktop runs and the app's MPRIS and tray code paths start.
          sudo apt-get install -y --no-install-recommends desktop-file-utils xvfb dbus
          # The bundled Java runtime draws through AWT, which links the X11
          # client libraries, fontconfig and ALSA from the host, as every desktop
          # already has them. Ubuntu's 64-bit-time_t transition renamed some, so
          # try both spellings and skip whichever the release doesn't carry.
          for pkg in libx11-6 libxext6 libxrender1 libxtst6 libxi6 libxrandr2 \
                     libfontconfig1 libfreetype6 libasound2t64 libasound2 libgl1; do
            if apt-cache show "$pkg" >/dev/null 2>&1; then
              sudo apt-get install -y --no-install-recommends "$pkg" || true
            fi
          done

      - uses: ./.github/actions/mount-tap
        with:
          ref: ${{ inputs.ref }}
          verify: navibeat-linux

      # Only this cask, so a style cop that starts flagging some other cask
      # cannot hold back a NaviBeat release. audit-casks.yml covers the whole tap.
      - name: Audit
        run: |
          brew audit --cask --strict jakobhviid/tap/navibeat-linux
          brew style --cask jakobhviid/tap/navibeat-linux

      - uses: ./.github/actions/fetch
        with:
          package: jakobhviid/tap/navibeat-linux
          kind: cask

      - name: Install
        run: brew install --cask jakobhviid/tap/navibeat-linux

      - name: Verify the launcher is on PATH and the payload is the pinned release
        run: |
          set -x
          command -v navibeat
          # `--help` needs no display, and running it through the bin symlink
          # proves AppRun found its tree and the bundled runtime starts. Its
          # first line is the app's own version, so this is also a direct check
          # that the payload is the release the cask pins, not only that its
          # bytes hashed correctly. Captured rather than piped into head, which
          # would hand the JVM a SIGPIPE under pipefail.
          version="$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/navibeat-linux.rb)"
          help="$(navibeat --help)"
          printf '%s\n' "$help"
          test "$(sed -n 1p <<<"$help")" = "NaviBeat $version"

      - name: Verify the bundled libVLC resolves on its own
        run: |
          # Why: libVLC is the reason this cask takes the full image over -slim,
          # and the app opens its window without it, so the smoke test below
          # cannot tell a broken libVLC from a working one — playback is the only
          # symptom, and that needs a server. Every library and plugin must
          # resolve from the bundle plus a stock host, with the library path
          # AppRun sets and nothing else.
          vlc="$(echo "$(brew --caskroom)"/navibeat-linux/*/squashfs-root/vlc)"
          test -f "$vlc/libvlc.so.5"
          missing="$(find "$vlc" -name '*.so*' -type f -exec env LD_LIBRARY_PATH="$vlc" ldd {} \; \
            | grep 'not found' | sort -u || true)"
          if [ -n "$missing" ]; then
            printf '%s\n' "$missing"
            echo "::error::the bundled libVLC needs libraries the host does not have"
            exit 1
          fi
          echo "$(find "$vlc" -name '*.so*' -type f | wc -l) libraries resolve"

      - name: Verify the desktop entry
        run: |
          set -x
          desktop="$HOME/.local/share/applications/navibeat.desktop"
          test -f "$desktop"
          cat "$desktop"
          desktop-file-validate "$desktop"
          # Exec must point at the stable Homebrew symlink, not a bare NaviBeat.
          grep -qx "Exec=$(brew --prefix)/bin/navibeat" "$desktop"
          # Icon= is what makes the installed PNG resolve by name, and
          # StartupWMClass is what groups the windows under it.
          grep -qx "Icon=navibeat" "$desktop"
          grep -qx "StartupWMClass=app-navibeat-desktop-MainKt" "$desktop"
          grep -qx "Categories=AudioVideo;Audio;Player;" "$desktop"

      - name: Verify the icon is the cropped 512px one
        run: |
          set -x
          icon="$HOME/.local/share/icons/hicolor/512x512/apps/navibeat.png"
          test -f "$icon"
          test "$(find "$HOME/.local/share/icons/hicolor" -path '*/apps/navibeat.png' | wc -l)" -eq 1
          # `%@` is the bounding box `-trim` would take: on the installed icon it
          # must already be the whole canvas. Upstream's own reports
          # 824x824+100+100 in a 1024px canvas, so this is the assertion that the
          # crop ran and still finds the border it removes. magick is on PATH
          # because the cask depends on it.
          test "$(magick identify -format '%wx%h %@' "$icon")" = "512x512 512x512+0+0"

      - name: Verify permissions are opened up and the image is reclaimed
        run: |
          set -x
          caskroom="$(brew --caskroom)/navibeat-linux"
          # Why `if` and not `! cmd`: bash exempts a `!`-negated command from
          # errexit, so only the last such line in a step could ever fail it.
          #
          # Upstream's image makes the AppDir root and everything under usr/
          # 0700, which would leave the install usable by the installing user
          # alone.
          if find "$caskroom" -type d ! -perm -0055 | grep .; then
            echo "::error::directories above are still closed to other users"
            exit 1
          fi
          # The 210 MB image is redundant once extracted.
          if find "$caskroom" -name '*.AppImage' | grep -q .; then
            echo "::error::the AppImage was not removed after extraction"
            exit 1
          fi
          test -x "$caskroom"/*/squashfs-root/AppRun

      - name: Reinstall to exercise the version-bump path
        run: |
          set -x
          # A version bump uninstalls then installs, moving every artifact back
          # into the Caskroom and re-running preflight against fresh staging.
          # Reinstall walks that same path without needing two published
          # versions, and NaviBeat ships several a day, so this path gets used.
          brew reinstall --cask jakobhviid/tap/navibeat-linux
          desktop="$HOME/.local/share/applications/navibeat.desktop"
          test -f "$desktop"
          grep -qx "Exec=$(brew --prefix)/bin/navibeat" "$desktop"
          test "$(find "$HOME/.local/share/icons/hicolor" -path '*/apps/navibeat.png' | wc -l)" -eq 1
          navibeat --help >/dev/null

      - name: Smoke-test the GUI under a virtual display
        timeout-minutes: 5
        run: |
          # Why not xvfb-run: it waits on every process still holding the
          # display. Own the server and do the killing.
          Xvfb :99 -screen 0 1280x1024x24 >/tmp/xvfb.log 2>&1 &
          xvfb_pid=$!
          export DISPLAY=:99
          sleep 3

          # Under a session bus of its own, as on any desktop, so the app's D-Bus
          # integrations start too. dbus-run-session lives exactly as long as
          # navibeat does, so its pid stands in for the app's.
          setsid dbus-run-session -- navibeat >/tmp/gui.log 2>&1 &
          app_pid=$!
          alive=1
          for _ in $(seq 1 30); do
            sleep 1
            kill -0 "$app_pid" 2>/dev/null || { alive=0; break; }
          done

          pkill -9 -f 'squashfs-root/usr/bin/NaviBeat' 2>/dev/null || true
          kill -9 "$xvfb_pid" 2>/dev/null || true

          echo "=== navibeat output ==="
          sed -n '1,150p' /tmp/gui.log
          if [ "$alive" -ne 1 ]; then
            echo "::error::navibeat exited on its own instead of staying up"
            exit 1
          fi
          # A native library that fails to load is caught and logged rather than
          # fatal on some paths, so staying up is not proof on its own. Skiko's
          # "Cannot create Linux GL context" is expected here: Xvfb has no GL,
          # and it falls back to software rendering, as it would on a host
          # without GPU drivers.
          if grep -q "UnsatisfiedLinkError" /tmp/gui.log; then
            echo "::error::a bundled native library failed to load — see the log above"
            exit 1
          fi
          echo "navibeat stayed up for 30s"

      - name: Verify the data directories the zap stanza targets
        run: |
          set -x
          find "$HOME/.config" "$HOME/.cache" "$HOME/.local/share" "$HOME/.java" \
            -maxdepth 3 -ipath '*navibeat*' -printf '%p\n' 2>/dev/null || true
          # The app derives both from the XDG variables with a lowercase
          # `navibeat` under each. The zap stanza depends on that spelling, so
          # pin it. Not asserted: the cache directory, the Java preferences node
          # and the search provider's .ini, none of which a bare launch creates.
          # The provider is off by default and deletes its .ini on a clean exit.
          test -d "$HOME/.config/navibeat"
          test -d "$HOME/.local/share/navibeat"

      - name: Uninstall with zap and verify nothing is left behind
        run: |
          set -x
          brew uninstall --cask --zap jakobhviid/tap/navibeat-linux
          # Why helpers and not `! cmd`: bash exempts a `!`-negated command from
          # errexit, so only the last such line in a step could ever fail it.
          gone() {
            if [ -e "$1" ]; then
              echo "::error::zap left $1 behind"
              exit 1
            fi
          }
          gone "$HOME/.local/share/applications/navibeat.desktop"
          gone "$HOME/.local/share/icons/hicolor/512x512/apps/navibeat.png"
          if command -v navibeat; then
            echo "::error::navibeat is still on PATH after uninstall"
            exit 1
          fi
          # The GUI smoke test above created these, so zap has real data to clear.
          gone "$HOME/.config/navibeat"
          gone "$HOME/.local/share/navibeat"

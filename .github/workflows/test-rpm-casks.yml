name: Test RPM-payload casks on Linux

# Why a second workflow rather than more steps in test-cask.yml: that one's
# matrix covers both architectures, and none of these vendors publishes an arm64
# Linux build these casks can use — they declare `depends_on arch: :x86_64`, so
# an arm64 job could only assert that installing refuses. Its audit/style/version
# loops already cover every cask in the tap, including these; what is here is the
# install and the integration each RPM-payload cask claims.
on:
  push:
    branches: [main]
    paths:
      - "Casks/proton-*-linux.rb"
      - "Casks/claude-desktop-linux.rb"
      - ".github/workflows/test-rpm-casks.yml"
  pull_request:
    paths:
      - "Casks/proton-*-linux.rb"
      - "Casks/claude-desktop-linux.rb"
      - ".github/workflows/test-rpm-casks.yml"
  workflow_dispatch:
  # Why: the scheduled bumps call this to validate a candidate commit before it
  # is allowed anywhere near main.
  workflow_call:
    inputs:
      ref:
        description: "Commit or branch to test. Defaults to the triggering ref."
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: test-rpm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cask:
    strategy:
      fail-fast: false
      matrix:
        # `launcher` names the payload's /usr/bin shape, which is the real
        # difference between these casks and drives the assertions below:
        # `symlink` for a relative symlink into ../lib/<pkg>/, `script` for a
        # launcher that hardcodes absolute /usr paths the cask has to rewrite.
        #
        # `exec_arg` is upstream's own field code and is deliberately not
        # normalised: %U takes a list of URLs, %u a single one.
        #
        # `launcher_log` and `extra_zap` are empty for a cask that has neither.
        include:
          - token: proton-mail-linux
            pkg: proton-mail
            # Upstream ships this icon as /usr/share/pixmaps/<pkg>.png containing
            # SVG data; the cask renames it on the way in, so assert the .svg.
            icon: .local/share/icons/hicolor/scalable/apps/proton-mail.svg
            userdata: Proton Mail
            launcher: symlink
            exec_arg: "%U"
            launcher_log: ""
            extra_zap: ""
          - token: proton-meet-linux
            pkg: proton-meet
            icon: .local/share/icons/hicolor/256x256/apps/proton-meet.png
            userdata: Proton Meet
            launcher: symlink
            exec_arg: "%U"
            launcher_log: ""
            extra_zap: ""
          - token: proton-pass-linux
            pkg: proton-pass
            icon: .local/share/icons/hicolor/scalable/apps/proton-pass.svg
            userdata: Proton Pass
            launcher: symlink
            exec_arg: "%U"
            launcher_log: ""
            extra_zap: ""
          - token: claude-desktop-linux
            pkg: claude-desktop-unofficial
            icon: .local/share/icons/hicolor/256x256/apps/claude-desktop-unofficial.png
            userdata: Claude
            launcher: script
            exec_arg: "%u"
            # This launcher sends the app's own output to its log rather than to
            # the terminal, so a sandbox failure is visible only there.
            launcher_log: .cache/claude-desktop-debian/launcher.log
            extra_zap: .cache/claude-desktop-debian
    runs-on: ubuntu-latest
    env:
      # Why: an auto-update fetches and hard-resets the tap from GitHub, which
      # would silently replace the commit under test with whatever is on main.
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Install desktop and Electron runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils cpio
          # Ubuntu's 64-bit-time_t transition renamed many of these, so try both
          # spellings per library and skip whichever the release doesn't carry.
          for pkg in libgtk-3-0t64 libgtk-3-0 libnss3 libasound2t64 libasound2 \
                     libatk1.0-0t64 libatk1.0-0 libatk-bridge2.0-0t64 libatk-bridge2.0-0 \
                     libatspi2.0-0t64 libatspi2.0-0 libcups2t64 libcups2 libgbm1 \
                     libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
                     libxtst6 libxss1 libnotify4 libudev1 libsecret-1-0; do
            if apt-cache show "$pkg" >/dev/null 2>&1; then
              sudo apt-get install -y --no-install-recommends "$pkg" || true
            fi
          done

      # Why rpm and cpio explicitly: the preflight extracts the payload with
      # `rpm2cpio | cpio`, which is present on any rpm-based distro but not on
      # an Ubuntu runner. Installing them here is what makes this test exercise
      # the real extraction path rather than a substitute.
      - name: Install rpm2cpio
        run: sudo apt-get install -y --no-install-recommends rpm

      - uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      - name: Restore the commit under test
        run: |
          # Why: setup-homebrew symlinks this checkout in as a tap and runs
          # `brew update`, which hard-resets the working tree to origin/main —
          # throwing away a caller-supplied ref while still reporting success.
          git checkout --force "${{ inputs.ref || github.sha }}"
          git log --oneline -1

      - name: Mount this checkout as the tap
        run: |
          set -x
          # Why `brew --repository <tap>`: it is what brew itself resolves the
          # tap to, which differs between macOS and linuxbrew layouts.
          tap_dir="$(brew --repository jakobhviid/tap)"
          if [ -L "$tap_dir" ]; then
            echo "already linked -> $(readlink "$tap_dir")"
          else
            rm -rf "$tap_dir"
            mkdir -p "$(dirname "$tap_dir")"
            ln -s "$GITHUB_WORKSPACE" "$tap_dir"
          fi
          brew trust --tap jakobhviid/tap

          # The tripwire: brew must report the version this checkout declares,
          # or a wrong-tree test passes silently.
          expected="$(sed -n 's/^  version "\(.*\)"$/\1/p' "Casks/${{ matrix.token }}.rb")"
          actual="$(brew info --cask --json=v2 "jakobhviid/tap/${{ matrix.token }}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["casks"][0]["version"])')"
          echo "${{ matrix.token }}: checkout=$expected brew=$actual"
          test "$expected" = "$actual"

      - name: Install
        run: brew install --cask "jakobhviid/tap/${{ matrix.token }}"

      - name: Verify the launcher binary resolves through Homebrew
        run: |
          set -x
          command -v "${{ matrix.pkg }}"
          target="$(readlink -f "$(command -v "${{ matrix.pkg }}")")"
          test -f "$target"
          file "$target"
          case "${{ matrix.launcher }}" in
            symlink)
              # The RPM's /usr/bin entry is a relative symlink into ../lib/<pkg>/,
              # so brew's bin symlink has to resolve through it to a real ELF.
              file "$target" | grep -q ELF
              ;;
            script)
              # The RPM ships a launcher script instead: it sources its shared
              # library and execs the Electron binary, both by absolute path,
              # which the cask rewrites into the Caskroom. A surviving /usr path
              # is a launcher reaching for a file only the system package
              # provides.
              #
              # The leading quote is what makes the match precise: the rewritten
              # path ends in the very /usr path it replaced, so an unanchored
              # grep flags a launcher that is in fact correct. Upstream quotes
              # every one of these assignments, so the quote is the reliable
              # marker of a path that is still bare.
              #
              # Spelled out rather than as `! grep`, because bash exempts a
              # `!`-inverted command from errexit and a mid-script one would only
              # print.
              if grep -qE '"/usr/(lib|bin)/${{ matrix.pkg }}' "$target"; then
                echo "::error::$target still names an unrewritten /usr path"
                grep -nE '"/usr/(lib|bin)/${{ matrix.pkg }}' "$target"
                exit 1
              fi
              # And the rewrite has to have gone somewhere: a launcher naming
              # neither /usr nor the Caskroom would satisfy the check above.
              grep -q "/Caskroom/${{ matrix.token }}/" "$target"
              # The script answers --version only after sourcing that library, so
              # this exits non-zero if the rewrite landed on a path that is not
              # there.
              "${{ matrix.pkg }}" --version
              ;;
          esac

      - name: Verify the desktop entry and its rewritten Exec
        run: |
          set -x
          entry="$HOME/.local/share/applications/${{ matrix.pkg }}.desktop"
          test -f "$entry"
          desktop-file-validate "$entry"
          # Upstream's Exec names a bare command or a /usr path that only the
          # system package provides — and GNOME's PATH excludes the Homebrew
          # prefix, so an unrewritten entry produces a launcher that silently
          # does nothing.
          grep -qx "Exec=$(brew --prefix)/bin/${{ matrix.pkg }} ${{ matrix.exec_arg }}" "$entry"

      - name: Verify the icon is installed where the entry can find it
        run: |
          set -x
          test -f "$HOME/${{ matrix.icon }}"
          # Icon=<pkg> resolves by name through the user icon theme, so the
          # basename has to match what the .desktop asks for.
          grep -qx "Icon=${{ matrix.pkg }}" "$HOME/.local/share/applications/${{ matrix.pkg }}.desktop"

      - name: Reinstall to exercise the version-bump path
        run: |
          set -x
          brew reinstall --cask "jakobhviid/tap/${{ matrix.token }}"
          grep -qx "Exec=$(brew --prefix)/bin/${{ matrix.pkg }} ${{ matrix.exec_arg }}" \
            "$HOME/.local/share/applications/${{ matrix.pkg }}.desktop"

      # Why this is needed and is not cheating: none of these installs ends up
      # with a usable SUID helper. Proton's vendor ships chrome-sandbox 0755, and
      # where a payload does carry the setuid bit a cask unpacks as the
      # installing user — so the bit lands on a file that is not root-owned and
      # the cask clears it. Either way they rely on Chromium's unprivileged
      # user-namespace sandbox. Ubuntu 24.04 runners restrict unprivileged userns
      # through AppArmor, which pushes Chromium onto the SUID path instead, where
      # it finds a helper it cannot use and aborts:
      #
      #   FATAL: The SUID sandbox helper binary was found, but is not configured
      #   correctly … owned by root and has mode 4755
      #
      # A cask cannot set setuid, so the fix is to give the runner the
      # precondition a real desktop already has rather than to launch with
      # --no-sandbox (which would test a configuration no user runs) or to chmod
      # 4755 in CI (which would test a file no user gets). Verified on Bazzite,
      # where user.max_user_namespaces is 125250 and the apps start with no
      # sandbox error at all.
      - name: Allow the unprivileged user-namespace sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          echo "max_user_namespaces=$(sysctl -n user.max_user_namespaces)"

      - name: Smoke-test the GUI under a virtual display
        timeout-minutes: 6
        run: |
          sudo apt-get install -y --no-install-recommends xvfb
          # Why not xvfb-run: it waits on every process still holding the
          # display, and Electron's zygote/gpu children outlive a SIGTERM to the
          # parent. Own the server and do the killing.
          Xvfb :99 -screen 0 1280x1024x24 >/tmp/xvfb.log 2>&1 &
          xvfb_pid=$!
          export DISPLAY=:99
          sleep 3

          setsid "${{ matrix.pkg }}" >/tmp/gui.log 2>&1 &
          app_pid=$!
          alive=1
          for _ in $(seq 1 30); do
            sleep 1
            kill -0 "$app_pid" 2>/dev/null || { alive=0; break; }
          done

          pkill -9 -f "${{ matrix.pkg }}" 2>/dev/null || true
          pkill -9 -f chrome_crashpad_handler 2>/dev/null || true
          kill -9 "$xvfb_pid" 2>/dev/null || true

          # A launcher that owns the app's output leaves /tmp/gui.log nearly
          # empty, so the sandbox check below has to read its log as well or it
          # would pass blind.
          if [ -n "${{ matrix.launcher_log }}" ]; then
            cat "$HOME/${{ matrix.launcher_log }}" >>/tmp/gui.log 2>/dev/null || true
          fi

          echo "=== ${{ matrix.pkg }} output ==="
          sed -n '1,150p' /tmp/gui.log
          if [ "$alive" -ne 1 ]; then
            echo "::error::${{ matrix.pkg }} exited on its own instead of staying up"
            exit 1
          fi
          # Why this check specifically: with no usable SUID helper these apps
          # depend on the unprivileged user-namespace sandbox. If a host misjudges
          # that, Chromium aborts here rather than opening a window — and a cask
          # cannot set setuid.
          if grep -qiE "SUID sandbox|chrome-sandbox|Failed to move to new namespace|No usable sandbox" /tmp/gui.log; then
            echo "::error::sandbox failure — see the log above"
            exit 1
          fi
          echo "${{ matrix.pkg }} stayed up for 30s with no sandbox error"

      - name: Verify the data directories the zap stanza targets
        run: |
          set -x
          find "$HOME/.config" "$HOME/.cache" -maxdepth 1 -iname "*${{ matrix.userdata }}*" -printf '%p\n' 2>/dev/null || true
          # Why pin this: Electron derives userData from productName, and the zap
          # stanza depends on the exact spelling. Mail's and Claude's were
          # observed directly; Meet's and Pass's were inferred from the same
          # convention, so this is where that inference is checked instead of
          # trusted.
          test -d "$HOME/.config/${{ matrix.userdata }}"
          # A launcher that keeps its log and config backups outside userData:
          # the zap has to reach that directory too.
          if [ -n "${{ matrix.extra_zap }}" ]; then
            test -d "$HOME/${{ matrix.extra_zap }}"
          fi

      - name: Uninstall with zap and verify nothing is left behind
        run: |
          set -x
          brew uninstall --cask --zap "jakobhviid/tap/${{ matrix.token }}"
          # Why a helper and not `! test -e`: bash exempts a `!`-inverted command
          # from errexit, so only the last such line in a step can fail it — and
          # the last line here is conditional on a matrix field.
          gone() {
            if [ -e "$1" ]; then
              echo "::error::zap left $1 behind"
              exit 1
            fi
          }
          gone "$HOME/.local/share/applications/${{ matrix.pkg }}.desktop"
          gone "$HOME/${{ matrix.icon }}"
          # The smoke test above created these, so zap has real data to clear.
          gone "$HOME/.config/${{ matrix.userdata }}"
          if [ -n "${{ matrix.extra_zap }}" ]; then
            gone "$HOME/${{ matrix.extra_zap }}"
          fi
          if command -v "${{ matrix.pkg }}"; then
            echo "::error::${{ matrix.pkg }} is still on PATH after uninstall"
            exit 1
          fi

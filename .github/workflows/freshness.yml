name: Check packages keep up with upstream

# Why: every other check here watches a pipeline that ran. This one watches for
# a pipeline that did not — a bump script that decided nothing moved, a
# disabled schedule, or one of the tool repos that push formulae here losing
# its token. None of those turns a run red; each just leaves a package behind
# upstream. So this asks upstream directly, with `brew livecheck`, and reports
# through scripts/report-ci.py any package that is behind on two runs in a row
# with its version here unchanged in between — stuck, not merely a release
# behind, which a daily-releasing upstream can be while its pipeline works.
on:
  schedule:
    # Daily, nominally after every bump (the last, Craft, is due at 08:15).
    # Scheduled runs here fire hours late, so a bump can still land after this
    # check; the unchanged-version rule is what keeps that from reading as stuck.
    - cron: "0 12 * * *"
  pull_request:
    paths:
      - ".github/workflows/freshness.yml"
      - ".github/actions/mount-tap/**"
      - "scripts/report-ci.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      # Why: an auto-update fetches and hard-resets the tap from GitHub, which
      # would silently replace the commit under test with whatever is on main.
      HOMEBREW_NO_AUTO_UPDATE: 1
      # Pull requests show what this would report, but open no issues and keep
      # no state, so a branch cannot disturb what main has recorded.
      REPORT: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/mount-tap

      - name: Ask upstream for every package's latest version
        run: |
          # Not `set -e` on livecheck's exit status: it is non-zero whenever any
          # one package cannot be checked, and those are listed as uncheckable
          # rather than allowed to hide the rest. Output that is not JSON at all
          # fails the report step below.
          brew livecheck --tap jakobhviid/tap --json > livecheck.json || true
          python3 -m json.tool livecheck.json | head -c 4000

      # The previous run's behind packages and their versions here: what tells
      # a stuck package from one a release behind. A run with none to restore
      # (the first, or after the cache expires) records and reports nothing.
      - name: Restore what the previous run found behind
        if: env.REPORT == 'true'
        uses: actions/cache/restore@v4
        with:
          path: freshness-state.json
          key: freshness-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: freshness-state-

      - name: Open, update or close the behind-upstream issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The state file is read before it is rewritten, so one path serves as
          # both the previous run's state and this run's.
          extra=()
          [ "$REPORT" = true ] || extra+=(--dry-run)
          python3 scripts/report-ci.py freshness --livecheck livecheck.json \
            --state-in freshness-state.json --state-out freshness-state.json "${extra[@]}"

      - name: Keep this run's list for the next
        if: env.REPORT == 'true'
        uses: actions/cache/save@v4
        with:
          path: freshness-state.json
          key: freshness-state-${{ github.run_id }}-${{ github.run_attempt }}

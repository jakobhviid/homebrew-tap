name: Bump Proton casks

# Why: Proton ships the desktop apps only as a direct .rpm resolved through a
# per-app version.json, so a hand-pinned cask goes stale silently — there is no
# release feed anyone watches. This bumps them unattended, and lands the commit
# on main only after the Linux suite has passed against that exact commit, so an
# upstream change that breaks a cask leaves main alone and shows up as a failed
# run instead.
on:
  schedule:
    # Proton's releases do not land on a predictable schedule; once a day is
    # enough for a desktop app and keeps the RPM downloads modest.
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bump-proton
  cancel-in-progress: false

# The shape every bump shares: _propose moves each cask on its own and pushes
# what moved to a scratch branch; the suite below tests that commit; _finish
# lands each cask that passed onto main and keeps one issue per broken cask.
jobs:
  propose:
    uses: ./.github/workflows/_propose.yml
    permissions:
      contents: write
    with:
      kind: proton
      tokens: >-
        proton-mail-linux proton-meet-linux proton-pass-linux
      candidate: auto/bump-proton

  validate:
    needs: propose
    if: needs.propose.outputs.moved != ''
    uses: ./.github/workflows/test-rpm-casks.yml
    with:
      ref: ${{ needs.propose.outputs.sha }}
      # Only the casks that moved: the others are on main as they are.
      tokens: ${{ needs.propose.outputs.moved }}

  finish:
    needs: [propose, validate]
    if: always()
    uses: ./.github/workflows/_finish.yml
    permissions:
      contents: write
      issues: write
      actions: read
    with:
      pipeline: "Proton casks"
      tokens: >-
        proton-mail-linux proton-meet-linux proton-pass-linux
      candidate: auto/bump-proton
      sha: ${{ needs.propose.outputs.sha }}
      moved: ${{ needs.propose.outputs.moved }}
      broken: ${{ needs.propose.outputs.broken }}
      propose-result: ${{ needs.propose.result }}
      validate-result: ${{ needs.validate.result }}

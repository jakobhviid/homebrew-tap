name: Propose a bump

# The first stage of every bump: move each package to upstream's latest on its
# own (scripts/propose.py), and push whatever moved to a scratch branch for the
# caller's test suite. A package whose feed cannot be read is reported broken
# and the rest carry on. The caller then tests the candidate and hands it to
# _finish.yml, which lands what passed.
on:
  workflow_call:
    inputs:
      kind:
        description: "Which bump script: github, claude, proton, craft or formula."
        type: string
        required: true
      tokens:
        description: "Space-separated packages this pipeline bumps."
        type: string
        required: true
      candidate:
        description: "Scratch branch the candidate commit is pushed to."
        type: string
        required: true
    outputs:
      sha:
        description: "The candidate commit, or empty when nothing moved."
        value: ${{ jobs.propose.outputs.sha }}
      moved:
        value: ${{ jobs.propose.outputs.moved }}
      broken:
        value: ${{ jobs.propose.outputs.broken }}

jobs:
  propose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
      moved: ${{ steps.bump.outputs.moved }}
      broken: ${{ steps.bump.outputs.broken }}
    steps:
      - uses: actions/checkout@v5

      - name: Move each package to upstream's latest
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/propose.py ${{ inputs.kind }} ${{ inputs.tokens }}

      # Why before the candidate is tested: the tests pour each formula's bottle
      # from its root_url, which is this repo's release for that version. A
      # bottle for a version that then fails its tests stays published but
      # unused; the next bump of that formula replaces or supersedes it.
      - name: Publish the moved formulae's bottles
        if: inputs.kind == 'formula' && steps.bump.outputs.moved != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MOVED: ${{ steps.bump.outputs.moved }}
        run: python3 scripts/bump-formula.py --publish $MOVED

      - name: Push the candidate to a scratch branch
        id: push
        if: steps.bump.outputs.moved != ''
        env:
          # Why through env, not `${{ }}` in the script: the message is built
          # from upstream's version strings, and an expression is pasted into
          # the shell verbatim — a crafted tag would run as code.
          MESSAGE: ${{ steps.bump.outputs.message }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Casks Formula scripts/craft-casks.json
          git commit -m "$MESSAGE"
          # Force-push: the branch is scratch space for this run only. _finish
          # lands the tested files onto whatever main is by then, so it does not
          # matter if main moves after this.
          git push --force origin "HEAD:refs/heads/$CANDIDATE"
          # An immutable sha, so validation cannot pick up a different commit
          # than the one proposed here.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

name: Test paseo-linux on Linux

# Why a third workflow rather than more steps in test-cask.yml: that one's matrix
# covers both architectures, and upstream publishes no arm64 Linux asset — this
# cask declares `depends_on arch: :x86_64`, so an arm64 job could only assert
# that installing refuses. Its audit/style/version loops already cover every cask
# in the tap, including this one; what is here is the install and the integration
# this cask claims.
on:
  push:
    branches: [main]
    paths:
      - "Casks/paseo-linux.rb"
      - ".github/workflows/test-paseo-cask.yml"
  pull_request:
    paths:
      - "Casks/paseo-linux.rb"
      - ".github/workflows/test-paseo-cask.yml"
  workflow_dispatch:
  # Why: the scheduled version bump calls this to validate a candidate commit
  # before it is allowed anywhere near main.
  workflow_call:
    inputs:
      ref:
        description: "Commit or branch to test. Defaults to the triggering ref."
        type: string
        required: false

permissions:
  contents: read

concurrency:
  # Why github.workflow: when the bump pipeline calls this reusably, this
  # resolves to the caller's name, so a validation run cannot be cancelled by an
  # unrelated push to the same ref.
  group: test-paseo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cask:
    runs-on: ubuntu-latest
    env:
      # Why: an auto-update fetches and hard-resets the tap from GitHub, which
      # would silently replace the commit under test with whatever is on main.
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v5
        with:
          # An empty value keeps actions/checkout's default behaviour, so the
          # push and workflow_dispatch triggers are unaffected.
          ref: ${{ inputs.ref }}

      - name: Install desktop and Electron runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          # Ubuntu's 64-bit-time_t transition renamed many of these, so try both
          # spellings per library and skip whichever the release doesn't carry.
          for pkg in libgtk-3-0t64 libgtk-3-0 libnss3 libasound2t64 libasound2 \
                     libatk1.0-0t64 libatk1.0-0 libatk-bridge2.0-0t64 libatk-bridge2.0-0 \
                     libatspi2.0-0t64 libatspi2.0-0 libcups2t64 libcups2 libgbm1 \
                     libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
                     libxtst6 libxss1 libnotify4 libudev1 libsecret-1-0; do
            if apt-cache show "$pkg" >/dev/null 2>&1; then
              sudo apt-get install -y --no-install-recommends "$pkg" || true
            fi
          done

      - uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      - name: Restore the commit under test
        run: |
          # Why: setup-homebrew symlinks this checkout in as a tap and runs
          # `brew update`, which hard-resets the working tree to origin/main —
          # throwing away a caller-supplied ref while still reporting success.
          git checkout --force "${{ inputs.ref || github.sha }}"
          git log --oneline -1

      - name: Mount this checkout as the tap
        run: |
          set -x
          # Why `brew --repository <tap>`: it is what brew itself resolves the
          # tap to, which differs between macOS and linuxbrew layouts.
          tap_dir="$(brew --repository jakobhviid/tap)"
          if [ -L "$tap_dir" ]; then
            echo "already linked -> $(readlink "$tap_dir")"
          else
            rm -rf "$tap_dir"
            mkdir -p "$(dirname "$tap_dir")"
            ln -s "$GITHUB_WORKSPACE" "$tap_dir"
          fi
          brew trust --tap jakobhviid/tap

          # The tripwire: brew must report the version this checkout declares,
          # or a wrong-tree test passes silently.
          expected="$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/paseo-linux.rb)"
          actual="$(brew info --cask --json=v2 jakobhviid/tap/paseo-linux \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["casks"][0]["version"])')"
          echo "paseo-linux: checkout=$expected brew=$actual"
          test "$expected" = "$actual"

      # Why audit here as well as in test-cask.yml: that workflow runs on any
      # Casks/** push, but the bump pipeline validates a candidate commit through
      # this workflow alone — without this step a bump could land unaudited.
      - name: Audit
        run: |
          brew audit --cask --strict jakobhviid/tap/paseo-linux
          brew style --cask jakobhviid/tap/paseo-linux

      - name: Install
        run: brew install --cask jakobhviid/tap/paseo-linux

      - name: Verify the CLI and the GUI launcher are on PATH
        run: |
          set -x
          command -v paseo
          command -v paseo-desktop
          # The CLI runs Electron in Node mode (ELECTRON_RUN_AS_NODE), so it
          # needs no display — and it reports the packaged app's own version, so
          # this is a direct check that the payload is the release the cask pins,
          # not only that its bytes hashed correctly.
          version="$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/paseo-linux.rb)"
          test "$(paseo --version)" = "$version"

      - name: Verify AppRun finds its AppDir when given arguments
        run: |
          set -x
          # Why this has its own step: upstream's AppRun locates the AppDir by
          # walking up from itself looking for a directory containing "$1", which
          # outside a mounted AppImage (where the runtime exports APPDIR) walks
          # past / and leaves APPDIR empty as soon as any argument is passed —
          # and the desktop entry passes two. The cask patches the test to look
          # for AppRun itself, so this is the regression check for that patch.
          caskroom="$(brew --caskroom)/paseo-linux"
          grep -q 'e "$path/AppRun"' "$caskroom"/*/squashfs-root/AppRun

          # And the same thing end to end, through the Homebrew bin symlink. The
          # app rejects the URL as an unknown command and exits non-zero, which is
          # fine and is upstream's business; what must not appear is the shell
          # failing to find the binary at all, which is what an empty APPDIR
          # produces ("/Paseo: No such file or directory").
          paseo-desktop --no-sandbox 'paseo://ci-appdir-check' >/tmp/appdir.log 2>&1 || true
          cat /tmp/appdir.log
          if grep -q "No such file or directory" /tmp/appdir.log; then
            echo "::error::AppRun resolved an empty AppDir — the APPDIR patch no longer applies"
            exit 1
          fi
          pkill -9 -f 'Paseo Daemon' 2>/dev/null || true
          pkill -9 -f 'Paseo Supervisor' 2>/dev/null || true

      - name: Verify the desktop entry
        run: |
          set -x
          entry="$HOME/.local/share/applications/Paseo.desktop"
          test -f "$entry"
          cat "$entry"
          desktop-file-validate "$entry"
          # Exec must point at the stable Homebrew symlink, not AppRun, and must
          # keep both of upstream's arguments.
          grep -qx "Exec=$(brew --prefix)/bin/paseo-desktop --no-sandbox %U" "$entry"
          # StartupWMClass is what lets the shell group Paseo's windows under the
          # icon, and Icon= is what makes the installed PNGs resolve by name.
          grep -qx "StartupWMClass=Paseo" "$entry"
          grep -qx "Icon=Paseo" "$entry"
          # The URL handler must survive the rewrite.
          grep -q "x-scheme-handler/paseo" "$entry"
          # brew owns the version, so the AppImage stamp must be gone.
          if grep -q "X-AppImage-Version" "$entry"; then
            echo "::error::the AppImage version stamp survived the rewrite"
            exit 1
          fi

      - name: Verify the icon is the borderless 512px one
        run: |
          set -x
          icon="$HOME/.local/share/icons/hicolor/512x512/apps/Paseo.png"
          test -f "$icon"
          # Exactly one: upstream's own 32/64/128 icons inset the artwork in a
          # transparent border, so installing any of them alongside this would put
          # a smaller-looking icon back in whichever context asks for that size.
          test "$(find "$HOME/.local/share/icons/hicolor" -path '*/apps/Paseo.png' | wc -l)" -eq 1
          # And it really is 512px. The cask picks the one asset in the payload
          # that fills its canvas; upstream shrinking or re-padding it is exactly
          # the regression that would restore the undersized launcher.
          python3 -c 'import struct,sys; d=open(sys.argv[1],"rb").read(24); w,h=struct.unpack(">II",d[16:24]); print(w,h); sys.exit(0 if w==h==512 else 1)' "$icon"

      - name: Verify the self-updater is disabled and the image is reclaimed
        run: |
          set -x
          caskroom="$(brew --caskroom)/paseo-linux"
          # electron-updater cannot run without its manifest, so brew keeps
          # ownership of the version instead of the app fetching a release it
          # cannot install.
          if find "$caskroom" -name app-update.yml | grep -q .; then
            echo "::error::the electron-updater manifest is still installed"
            exit 1
          fi
          # The 143 MB image is redundant once extracted.
          if find "$caskroom" -name '*.AppImage' | grep -q .; then
            echo "::error::the AppImage was kept alongside the extracted tree"
            exit 1
          fi
          test -x "$caskroom"/*/squashfs-root/AppRun

      - name: Reinstall to exercise the version-bump path
        run: |
          set -x
          # A version bump uninstalls then installs, moving every artifact back
          # into the Caskroom and re-running preflight against fresh staging.
          # Reinstall walks that same path without needing two published versions.
          brew reinstall --cask jakobhviid/tap/paseo-linux
          grep -qx "Exec=$(brew --prefix)/bin/paseo-desktop --no-sandbox %U" \
            "$HOME/.local/share/applications/Paseo.desktop"
          test "$(find "$HOME/.local/share/icons/hicolor" -path '*/apps/Paseo.png' | wc -l)" -eq 1
          paseo --version

      - name: Smoke-test the GUI under a virtual display
        timeout-minutes: 6
        run: |
          sudo apt-get install -y --no-install-recommends xvfb
          # Why not xvfb-run: it waits on every process still holding the display,
          # and Electron's zygote/gpu children outlive a SIGTERM to the parent.
          # Own the server and do the killing.
          Xvfb :99 -screen 0 1280x1024x24 >/tmp/xvfb.log 2>&1 &
          xvfb_pid=$!
          export DISPLAY=:99
          sleep 3

          # Launched exactly as the desktop entry does, --no-sandbox included, so
          # this tests the configuration users actually get.
          setsid paseo-desktop --no-sandbox >/tmp/gui.log 2>&1 &
          app_pid=$!
          alive=1
          for _ in $(seq 1 30); do
            sleep 1
            kill -0 "$app_pid" 2>/dev/null || { alive=0; break; }
          done

          # The app starts a supervisor and a daemon that outlive the window, so
          # killing the launcher alone leaves them holding the display and
          # writing to ~/.paseo.
          pkill -9 -f 'Paseo Daemon' 2>/dev/null || true
          pkill -9 -f 'Paseo Supervisor' 2>/dev/null || true
          pkill -9 -f 'squashfs-root/Paseo' 2>/dev/null || true
          pkill -9 -f chrome_crashpad_handler 2>/dev/null || true
          kill -9 "$xvfb_pid" 2>/dev/null || true

          echo "=== paseo-desktop output ==="
          sed -n '1,150p' /tmp/gui.log
          if [ "$alive" -ne 1 ]; then
            echo "::error::paseo-desktop exited on its own instead of staying up"
            exit 1
          fi
          echo "paseo-desktop stayed up for 30s"

      - name: Verify the data directories the zap stanza targets
        run: |
          set -x
          find "$HOME/.config" "$HOME/.cache" -maxdepth 1 -iname '*paseo*' -printf '%p\n' 2>/dev/null || true
          # Electron derives userData from the name main.js sets, which is the
          # capitalised "Paseo"; the daemon keeps its own state in ~/.paseo. The
          # zap stanza depends on both spellings, so pin them.
          test -d "$HOME/.config/Paseo"
          test -d "$HOME/.paseo"

      - name: Uninstall with zap and verify nothing is left behind
        run: |
          set -x
          brew uninstall --cask --zap jakobhviid/tap/paseo-linux
          # Why a helper and not `! test -e`: bash exempts a `!`-inverted command
          # from errexit, so only the last such line in a step could fail it.
          gone() {
            if [ -e "$1" ]; then
              echo "::error::zap left $1 behind"
              exit 1
            fi
          }
          gone "$HOME/.local/share/applications/Paseo.desktop"
          gone "$HOME/.config/Paseo"
          gone "$HOME/.paseo"
          test "$(find "$HOME/.local/share/icons/hicolor" -path '*/apps/Paseo.png' | wc -l)" -eq 0
          if command -v paseo || command -v paseo-desktop; then
            echo "::error::a paseo binary is still on PATH after uninstall"
            exit 1
          fi

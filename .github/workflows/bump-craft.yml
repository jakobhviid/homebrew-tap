name: Bump Craft casks

# Why: the ArtCraft apps release near-daily — VectorCraft shipped four versions
# in two days — so fourteen casks pinned by hand would always be behind. This
# moves every pin to upstream's latest release in one pass, tests the apps that
# moved on both architectures, and lands each app that passed, so an upstream
# packaging change that breaks one app holds back that app and nothing else.
#
# Why one run for all fourteen: they share a template and a pins file, so a run
# per app would mean fourteen candidates racing over the same file. One candidate
# holds every app that moved, and _finish lands them app by app.
on:
  schedule:
    # Upstream tags land at varied times. 08:15 UTC does not collide with the
    # orca (06:00), Proton (06:30), claude (07:17) or paseo (07:45) bumps, which
    # would otherwise contend for the same runners and API budget.
    - cron: "15 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bump-craft
  cancel-in-progress: false

# The shape every bump shares: _propose moves each cask on its own and pushes
# what moved to a scratch branch; the suite below tests that commit; _finish
# lands each cask that passed onto main and keeps one issue per broken cask.
jobs:
  propose:
    uses: ./.github/workflows/_propose.yml
    permissions:
      contents: write
    with:
      kind: craft
      tokens: >-
        photocraft-linux vectorcraft-linux pdfcraft-linux lightcraft-linux filmcraft-linux effectcraft-linux designcraft-linux wordcraft-linux gridcraft-linux deckcraft-linux cadcraft-linux soundcraft-linux figcraft-linux artcraft-launcher-linux
      candidate: auto/bump-craft

  validate:
    needs: propose
    if: needs.propose.outputs.moved != ''
    uses: ./.github/workflows/test-craft-casks.yml
    with:
      ref: ${{ needs.propose.outputs.sha }}
      # Only the casks that moved: the others are on main as they are.
      tokens: ${{ needs.propose.outputs.moved }}

  finish:
    needs: [propose, validate]
    if: always()
    uses: ./.github/workflows/_finish.yml
    permissions:
      contents: write
      issues: write
      actions: read
    with:
      pipeline: "Craft casks"
      tokens: >-
        photocraft-linux vectorcraft-linux pdfcraft-linux lightcraft-linux filmcraft-linux effectcraft-linux designcraft-linux wordcraft-linux gridcraft-linux deckcraft-linux cadcraft-linux soundcraft-linux figcraft-linux artcraft-launcher-linux
      candidate: auto/bump-craft
      sha: ${{ needs.propose.outputs.sha }}
      moved: ${{ needs.propose.outputs.moved }}
      broken: ${{ needs.propose.outputs.broken }}
      propose-result: ${{ needs.propose.result }}
      validate-result: ${{ needs.validate.result }}

name: Bump claude-desktop-linux

# Why: this is a daily-driver app whose upstream repackages Anthropic's client,
# so a release lands whenever either side moves — often several a week — and a
# hand-pinned cask goes stale fast. This bumps it unattended, and lands the
# commit on main only after the RPM-payload suite has passed against that exact
# commit, so an upstream change that breaks the cask leaves main alone and shows
# up as a failed run instead.
on:
  schedule:
    # Upstream publishes in the early UTC morning; 07:17 clears that and does not
    # collide with the orca (06:00) or Proton (06:30) bumps, which would
    # otherwise contend for the same runners and API budget.
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bump-claude
  cancel-in-progress: false

# The shape every bump shares: _propose moves each cask on its own and pushes
# what moved to a scratch branch; the suite below tests that commit; _finish
# lands each cask that passed onto main and keeps one issue per broken cask.
jobs:
  propose:
    uses: ./.github/workflows/_propose.yml
    permissions:
      contents: write
    with:
      kind: claude
      tokens: >-
        claude-desktop-linux
      candidate: auto/bump-claude-desktop-linux

  validate:
    needs: propose
    if: needs.propose.outputs.moved != ''
    uses: ./.github/workflows/test-rpm-casks.yml
    with:
      ref: ${{ needs.propose.outputs.sha }}
      # Only the casks that moved: the others are on main as they are.
      tokens: ${{ needs.propose.outputs.moved }}

  finish:
    needs: [propose, validate]
    if: always()
    uses: ./.github/workflows/_finish.yml
    permissions:
      contents: write
      issues: write
      actions: read
    with:
      pipeline: claude-desktop-linux
      tokens: >-
        claude-desktop-linux
      candidate: auto/bump-claude-desktop-linux
      sha: ${{ needs.propose.outputs.sha }}
      moved: ${{ needs.propose.outputs.moved }}
      broken: ${{ needs.propose.outputs.broken }}
      propose-result: ${{ needs.propose.result }}
      validate-result: ${{ needs.validate.result }}

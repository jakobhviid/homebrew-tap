name: Sync README tool list

# Keeps the catalog table in README.md in step with Formula/*.rb and Casks/*.rb.
# Runs whenever a formula or cask changes — including the pushes each tool's own
# release CI makes here.
on:
  push:
    branches: [main]
    paths:
      - "Formula/**"
      - "Casks/**"
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs so overlapping formula pushes don't race on the README commit.
concurrency:
  group: sync-readme
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate tool list
        run: python3 scripts/gen-readme.py

      - name: Commit if the table changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README already in sync with the formulae and casks."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync README tool list with formulae and casks"
          # A README-only commit touches neither Formula/** nor Casks/**, so it won't re-trigger
          # this workflow. Rebase-retry once in case a concurrent push landed.
          git push origin HEAD:main || {
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          }

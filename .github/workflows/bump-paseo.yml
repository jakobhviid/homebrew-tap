name: Bump paseo-linux

# Why: Paseo ships releases frequently and the Linux AppImage filename carries no
# version, so nothing about a stale pin is visible from the URL — the cask would
# just keep installing an old build. This bumps it unattended, and lands the
# commit on main only after the paseo suite has passed against that exact commit,
# so an upstream change that breaks the cask leaves main alone and shows up as a
# failed run instead.
on:
  schedule:
    # Upstream's releases land around 00:30 UTC. 07:45 clears that and does not
    # collide with the orca (06:00), Proton (06:30) or claude (07:17) bumps,
    # which would otherwise contend for the same runners and API budget.
    - cron: "45 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bump-paseo
  cancel-in-progress: false

env:
  CANDIDATE_BRANCH: auto/bump-paseo-linux

jobs:
  propose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      bump: ${{ steps.bump.outputs.bump }}
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Rewrite the cask if upstream moved
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/bump-cask.py Casks/paseo-linux.rb
          if git diff --quiet -- Casks/paseo-linux.rb; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/paseo-linux.rb)"
          echo "bump=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git diff -- Casks/paseo-linux.rb

      - name: Push the candidate to a throwaway branch
        id: push
        if: steps.bump.outputs.bump == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/paseo-linux.rb
          git commit -m "paseo-linux ${{ steps.bump.outputs.version }}"
          # Force-push: the branch is scratch space for this run only, and it is
          # branched from the current main so landing it stays a fast-forward.
          git push --force origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          # An immutable sha, so validation cannot pick up a different commit
          # than the one that was measured here.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Why reuse the suite rather than a smoke test: a version bump is exactly the
  # case where upstream can move the desktop file, the icon set, the bundled CLI
  # or the AppRun launcher out from under the cask — and AppRun in particular is
  # patched by hand here, so a rewrite upstream must fail loudly rather than
  # silently produce a launcher that cannot find its own AppDir.
  validate:
    needs: propose
    if: needs.propose.outputs.bump == 'true'
    uses: ./.github/workflows/test-paseo-cask.yml
    with:
      ref: ${{ needs.propose.outputs.sha }}

  land:
    needs: [propose, validate]
    if: needs.propose.outputs.bump == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.propose.outputs.sha }}
          fetch-depth: 0
      - name: Fast-forward main and drop the branch
        run: |
          # Push the validated sha itself, not a branch that could have moved.
          git push origin "${{ needs.propose.outputs.sha }}:refs/heads/main"
          git push origin --delete "$CANDIDATE_BRANCH"
          echo "Landed paseo-linux ${{ needs.propose.outputs.version }} on main."

  # Why: without this the branch survives a failed validation and the next run's
  # force-push would silently rebase a candidate nobody looked at.
  cleanup:
    needs: [propose, validate]
    if: always() && needs.propose.outputs.bump == 'true' && needs.validate.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Delete the rejected candidate
        run: |
          git push origin --delete "$CANDIDATE_BRANCH" || true
          echo "::error::paseo-linux ${{ needs.propose.outputs.version }} failed validation; main left at its previous version."
          exit 1

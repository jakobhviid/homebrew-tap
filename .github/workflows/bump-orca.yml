name: Bump orca-linux

# Why: Orca publishes a release most days, so a hand-pinned cask is stale within
# a day. This bumps it unattended — but only lands the commit on main after the
# full Linux suite has passed on both architectures, so an upstream change that
# breaks the cask leaves main untouched and shows up as a failed run instead.
on:
  schedule:
    # Upstream's releases land between roughly 00:45 and 05:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bump-orca
  cancel-in-progress: false

# The shape every bump shares: _propose moves each cask on its own and pushes
# what moved to a scratch branch; the suite below tests that commit; _finish
# lands each cask that passed onto main and keeps one issue per broken cask.
jobs:
  propose:
    uses: ./.github/workflows/_propose.yml
    permissions:
      contents: write
    with:
      kind: github
      tokens: >-
        orca-linux
      candidate: auto/bump-orca-linux

  validate:
    needs: propose
    if: needs.propose.outputs.moved != ''
    uses: ./.github/workflows/test-cask.yml
    with:
      ref: ${{ needs.propose.outputs.sha }}

  finish:
    needs: [propose, validate]
    if: always()
    uses: ./.github/workflows/_finish.yml
    permissions:
      contents: write
      issues: write
      actions: read
    with:
      pipeline: orca-linux
      tokens: >-
        orca-linux
      candidate: auto/bump-orca-linux
      sha: ${{ needs.propose.outputs.sha }}
      moved: ${{ needs.propose.outputs.moved }}
      broken: ${{ needs.propose.outputs.broken }}
      propose-result: ${{ needs.propose.result }}
      validate-result: ${{ needs.validate.result }}

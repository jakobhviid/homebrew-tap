name: Test casks on Linux

# Why: the casks in this tap are Linux-only, so nothing about them can be
# verified on a macOS dev machine — not the AppImage extraction, not the
# desktop-entry rewrite, not the zap. This installs each cask on a real Linux
# runner for both shipped architectures and asserts the integration it claims.
on:
  push:
    branches: [main]
    paths:
      - "Casks/**"
      - ".github/workflows/test-cask.yml"
  pull_request:
    paths:
      - "Casks/**"
      - ".github/workflows/test-cask.yml"
  workflow_dispatch:
  # Why: the scheduled version bump calls this to validate a candidate commit on
  # both architectures before it is allowed anywhere near main.
  workflow_call:
    inputs:
      ref:
        description: "Commit or branch to test. Defaults to the triggering ref."
        type: string
        required: false

permissions:
  contents: read

concurrency:
  # Why github.workflow: when the bump pipeline calls this reusably, this
  # resolves to the caller's name, so a validation run cannot be cancelled by an
  # unrelated push to the same ref.
  group: test-cask-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cask:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          # An empty value keeps actions/checkout's default behaviour, so the
          # push and workflow_dispatch triggers are unaffected.
          ref: ${{ inputs.ref }}

      - name: Install desktop and Electron runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          # Ubuntu's 64-bit-time_t transition renamed many of these, so try both
          # spellings per library and skip whichever the release doesn't carry.
          for pkg in libgtk-3-0t64 libgtk-3-0 libnss3 libasound2t64 libasound2 \
                     libatk1.0-0t64 libatk1.0-0 libatk-bridge2.0-0t64 libatk-bridge2.0-0 \
                     libatspi2.0-0t64 libatspi2.0-0 libcups2t64 libcups2 libgbm1 \
                     libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
                     libxtst6 libxss1 libnotify4 libudev1; do
            if apt-cache show "$pkg" >/dev/null 2>&1; then
              sudo apt-get install -y --no-install-recommends "$pkg" || true
            fi
          done

      - uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      - name: Mount this checkout as the tap
        run: |
          tap_dir="$(brew --repository)/Library/Taps/jakobhviid/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          # README tells users to trust before tapping, so prove that order works.
          brew trust --tap jakobhviid/tap
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"
          brew tap-info jakobhviid/tap

      - name: Audit
        run: |
          for cask in Casks/*.rb; do
            token="$(basename "$cask" .rb)"
            echo "::group::audit $token"
            brew audit --cask --strict "jakobhviid/tap/$token"
            brew style --cask "jakobhviid/tap/$token"
            echo "::endgroup::"
          done

      - name: Install
        run: brew install --cask jakobhviid/tap/orca-linux

      - name: Verify CLI and GUI launchers are on PATH
        run: |
          set -x
          command -v orca
          command -v orca-ide
          # The CLI runs Electron in Node mode (ELECTRON_RUN_AS_NODE), so it needs
          # no display; DT_RPATH=$ORIGIN resolves the bundled libffmpeg.
          orca --version | tee /tmp/orca-version
          version="$(brew info --cask --json=v2 jakobhviid/tap/orca-linux | python3 -c 'import json,sys; print(json.load(sys.stdin)["casks"][0]["version"])')"
          grep -q "$version" /tmp/orca-version

      - name: Verify desktop entry
        run: |
          set -x
          desktop="$HOME/.local/share/applications/orca-ide.desktop"
          test -f "$desktop"
          cat "$desktop"
          desktop-file-validate "$desktop"
          # Exec must point at the stable Homebrew symlink, not AppRun.
          grep -qx "Exec=$(brew --prefix)/bin/orca-ide %U" "$desktop"
          grep -qx "Categories=Development;IDE;" "$desktop"
          # StartupWMClass is what lets the shell group Orca's windows under the icon.
          grep -qx "StartupWMClass=orca" "$desktop"
          # The URL handler and markdown association must survive the rewrite.
          grep -q "x-scheme-handler/orca" "$desktop"
          # brew owns the version, so the AppImage stamp must be gone.
          ! grep -q "X-AppImage-Version" "$desktop"

      - name: Verify all eight icon sizes
        run: |
          set -x
          count="$(find "$HOME/.local/share/icons/hicolor" -path '*/apps/orca-ide.png' | wc -l)"
          test "$count" -eq 8
          for size in 16x16 24x24 32x32 48x48 64x64 128x128 256x256 512x512; do
            test -f "$HOME/.local/share/icons/hicolor/$size/apps/orca-ide.png"
          done

      - name: Verify the self-updater is disabled and the image is reclaimed
        run: |
          set -x
          caskroom="$(brew --caskroom)/orca-linux"
          # electron-updater cannot run without its manifest, so brew keeps
          # ownership of the version instead of the app overwriting AppRun.
          ! find "$caskroom" -name app-update.yml | grep -q .
          # The 193 MB image is redundant once extracted.
          ! find "$caskroom" -name '*.AppImage' | grep -q .
          test -x "$caskroom/$(brew info --cask --json=v2 jakobhviid/tap/orca-linux | python3 -c 'import json,sys; print(json.load(sys.stdin)["casks"][0]["version"])')/squashfs-root/AppRun"

      - name: Reinstall to exercise the version-bump path
        run: |
          set -x
          # A version bump uninstalls then installs, moving every artifact back
          # into the Caskroom and re-running preflight against fresh staging.
          # Reinstall walks that same path without needing two published versions,
          # and Orca ships daily, so this path gets used a lot.
          brew reinstall --cask jakobhviid/tap/orca-linux
          desktop="$HOME/.local/share/applications/orca-ide.desktop"
          test -f "$desktop"
          grep -qx "Exec=$(brew --prefix)/bin/orca-ide %U" "$desktop"
          test "$(find "$HOME/.local/share/icons/hicolor" -path '*/apps/orca-ide.png' | wc -l)" -eq 8
          orca --version
          ! find "$(brew --caskroom)/orca-linux" -name app-update.yml | grep -q .

      - name: Smoke-test the GUI under a virtual display
        timeout-minutes: 5
        run: |
          sudo apt-get install -y --no-install-recommends xvfb
          # Why not xvfb-run: it waits on every process still holding the display,
          # and Electron's zygote/gpu children outlive a SIGTERM to the parent, so
          # the step hung indefinitely on arm64. Own the server and do the killing.
          Xvfb :99 -screen 0 1280x1024x24 >/tmp/xvfb.log 2>&1 &
          xvfb_pid=$!
          export DISPLAY=:99
          sleep 3

          setsid orca-ide >/tmp/gui.log 2>&1 &
          app_pid=$!
          alive=1
          for _ in $(seq 1 30); do
            sleep 1
            kill -0 "$app_pid" 2>/dev/null || { alive=0; break; }
          done

          pkill -9 -f 'squashfs-root/orca-ide' 2>/dev/null || true
          pkill -9 -f chrome_crashpad_handler 2>/dev/null || true
          kill -9 "$xvfb_pid" 2>/dev/null || true

          echo "=== orca-ide output ==="
          sed -n '1,150p' /tmp/gui.log
          if [ "$alive" -ne 1 ]; then
            echo "::error::orca-ide exited on its own instead of staying up"
            exit 1
          fi
          # chrome-sandbox loses its setuid bit during extraction, so if AppRun's
          # user-namespace probe misjudges the host, Chromium aborts here rather
          # than opening a window.
          if grep -qiE "SUID sandbox|chrome-sandbox|Failed to move to new namespace|No usable sandbox" /tmp/gui.log; then
            echo "::error::sandbox failure — see the log above"
            exit 1
          fi
          echo "orca-ide stayed up for 30s with no sandbox error"

      - name: Verify the data directories the zap stanza targets
        run: |
          set -x
          find "$HOME/.config" "$HOME/.cache" -maxdepth 1 -iname '*orca*' -printf '%p\n' 2>/dev/null || true
          # Electron derives userData from the asar's `name`, which is lowercase.
          # The zap stanza depends on this exact spelling, so pin it.
          test -d "$HOME/.config/orca"
          test -d "$HOME/.orca"

      - name: Uninstall with zap and verify nothing is left behind
        run: |
          set -x
          brew uninstall --cask --zap jakobhviid/tap/orca-linux
          ! test -e "$HOME/.local/share/applications/orca-ide.desktop"
          ! find "$HOME/.local/share/icons/hicolor" -path '*/apps/orca-ide.png' | grep -q .
          ! command -v orca
          ! command -v orca-ide
          # The GUI smoke test above created these, so zap has real data to clear.
          ! test -e "$HOME/.config/orca"
          ! test -e "$HOME/.orca"
